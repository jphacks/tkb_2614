<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="240" height="240" viewBox="0 0 240 240" fill="none" class="anim-rain" role="img" aria-label="雨のため窓を開けない"><style>
.anim-rain .rain-1 {animation: rainFall 1.3s ease-in infinite;animation-play-state:var(--motion,running)}
.anim-rain .rain-2 {animation: rainFall 1.55s ease-in infinite;animation-delay:-.75s;animation-play-state:var(--motion,running)}
.anim-rain .rain-3 {animation: rainFall 1.15s ease-in infinite;animation-delay:-.3s;animation-play-state:var(--motion,running)}
.anim-rain .rain-4 {animation: rainFall 1.4s ease-in infinite;animation-delay:-.95s;animation-play-state:var(--motion,running)}
.anim-rain .umbrella {transform-box:view-box;transform-origin:206px 30px;animation: umbrellaBob 2.8s ease-in-out infinite;animation-play-state:var(--motion,running)}
.anim-rain .close-arrow {animation: rainArrow 2.8s ease-in-out infinite;animation-play-state:var(--motion,running)}
@keyframes rainFall {0%{opacity:0;transform:translate(5px,-10px)} 20%{opacity:1} 85%{opacity:1} 100%{opacity:0;transform:translate(-8px,13px)} }
@keyframes umbrellaBob {0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(2px) rotate(2deg)} }
@keyframes rainArrow {0%,100%{opacity:1} 50%{opacity:.6} }
@media (prefers-reduced-motion: reduce) {
  svg * {animation:none !important;}
}
