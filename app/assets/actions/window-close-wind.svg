<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="240" height="240" viewBox="0 0 240 240" fill="none" class="anim-wind" role="img" aria-label="強風のため窓を開けない"><style>
.anim-wind .wind-gust-1 {animation: windGustA 1.7s ease-in-out infinite; animation-play-state:var(--motion,running)}
.anim-wind .wind-gust-2 {animation: windGustB 1.9s ease-in-out infinite; animation-play-state:var(--motion,running)}
.anim-wind .leaf {transform-box:view-box;transform-origin:226px 27px;animation: windLeaf 2.4s ease-in-out infinite;animation-play-state:var(--motion,running)}
.anim-wind .close-arrow {animation: closedWindArrow 2.4s ease-in-out infinite;animation-play-state:var(--motion,running)}
@keyframes windGustA {0%{opacity:.5;transform:translateX(6px)} 60%{opacity:1;transform:translateX(-4px)} 100%{opacity:.5;transform:translateX(6px)} }
@keyframes windGustB {0%{opacity:1;transform:translateX(2px)} 65%{opacity:.5;transform:translateX(-7px)} 100%{opacity:1;transform:translateX(2px)} }
@keyframes windLeaf {0%,100%{transform:rotate(-7deg) translate(0,0)} 50%{transform:rotate(12deg) translate(-4px,2px)} }
@keyframes closedWindArrow {0%,100%{opacity:1} 50%{opacity:.55} }
@media (prefers-reduced-motion: reduce) {
  svg * {animation:none !important;}
}
