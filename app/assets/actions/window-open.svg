<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" class="anim-open" role="img" aria-label="窓を開けて換気する">
<style>
.anim-open .sash{transform:translateX(0px)}
.anim-open .inside-air{animation-play-state:var(--motion,running);transform-box:fill-box;transform-origin:center}
.anim-open .air-one{animation:moistureOutA 2.4s ease-in infinite}
.anim-open .air-two{animation:moistureOutB 2.8s ease-in infinite}
.anim-open .air-three{animation:moistureOutC 2.2s ease-in infinite}
.anim-open .flow-symbol{animation:openFlow 1.8s ease-in-out infinite;animation-play-state:var(--motion,running)}
@keyframes moistureOutA{0%{transform:translate(0,0) scale(1);opacity:.18}20%{opacity:.88}100%{transform:translate(74px,-6px) scale(.55);opacity:0}}
@keyframes moistureOutB{0%{transform:translate(0,0) scale(1);opacity:.22}20%{opacity:.92}100%{transform:translate(64px,-10px) scale(.5);opacity:0}}
@keyframes moistureOutC{0%{transform:translate(0,0) scale(1);opacity:.18}20%{opacity:.9}100%{transform:translate(82px,2px) scale(.48);opacity:0}}
@keyframes openFlow{0%,100%{opacity:.4;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){svg *{animation:none !important;}}
</style>
