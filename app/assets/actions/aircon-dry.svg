<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" class="anim-aircon" role="img" aria-label="エアコンで除湿する">
<style>
.anim-aircon .status-led{animation:airconLED 2.1s ease-in-out infinite;animation-play-state:var(--motion,running)}
.anim-aircon .arrow-stream{animation:intakePulse 1.8s ease-in-out infinite;animation-play-state:var(--motion,running)}
.anim-aircon .vapor-a,.anim-aircon .vapor-b,.anim-aircon .vapor-c{animation-play-state:var(--motion,running);transform-box:fill-box;transform-origin:center}
.anim-aircon .vapor-a{animation:suckA 2.6s ease-in infinite}
.anim-aircon .vapor-b{animation:suckB 2.9s ease-in infinite}
.anim-aircon .vapor-c{animation:suckC 2.4s ease-in infinite}
@keyframes airconLED{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes intakePulse{0%,100%{opacity:.5;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes suckA{0%{transform:translate(0,0) scale(1);opacity:.12}18%{opacity:.88}100%{transform:translate(22px,-96px) scale(.32);opacity:0}}
@keyframes suckB{0%{transform:translate(0,0) scale(1);opacity:.14}18%{opacity:.92}100%{transform:translate(0,-102px) scale(.28);opacity:0}}
@keyframes suckC{0%{transform:translate(0,0) scale(1);opacity:.12}18%{opacity:.86}100%{transform:translate(-22px,-98px) scale(.3);opacity:0}}
@media (prefers-reduced-motion: reduce){svg *{animation:none !important;}}
</style>
