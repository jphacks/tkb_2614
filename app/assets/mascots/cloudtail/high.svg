<svg xmlns="http://www.w3.org/2000/svg" class="mo-svg mo-cloudtail mo-high" viewBox="0 0 320 280" width="320" height="280" role="img" aria-label="くもりしっぽ・ぐったり">
<style><![CDATA[
 .mo-cloudtail{overflow:visible;user-select:none;touch-action:manipulation}
 .mo-cloudtail .tap-body{transform-origin:160px 235px}
 .mo-cloudtail .breath{transform-origin:160px 221px;animation:cloudtail-breath 3.2s ease-in-out infinite}
 .mo-cloudtail .blink{transform-box:fill-box;transform-origin:center;animation:cloudtail-blink 5.8s infinite}
 .mo-cloudtail .feature{transform-origin:167px 187px;animation:cloudtail-feature 4.5s ease-in-out infinite}
 .mo-cloudtail .mold-float{animation:cloudtail-mold 3.5s ease-in-out infinite}
 .mo-cloudtail .mold-float.late{animation-delay:-1.5s}
 .mo-cloudtail .mold-float.slow{animation-duration:4.7s;animation-delay:-2.1s}
 .mo-cloudtail.mo-medium .breath{animation-duration:4.2s}
 .mo-cloudtail.mo-high .breath{animation-duration:5.1s}
 .mo-cloudtail.mo-medium .feature{animation-duration:5.3s}
 .mo-cloudtail.mo-high .feature{animation-duration:6.8s}
 .mo-cloudtail.mo-low.is-tapped .tap-body{animation:cloudtail-happy .72s cubic-bezier(.22,.8,.3,1) 1 both}
 .mo-cloudtail.mo-medium.is-tapped .tap-body{animation:cloudtail-startle .69s ease-out 1 both}
 .mo-cloudtail.mo-high.is-tapped .tap-body{animation:cloudtail-weak .78s ease-out 1 both}
 .mo-cloudtail.is-tapped .mold-float{animation:cloudtail-mold-startle .78s ease-out 1 both}
 @keyframes cloudtail-breath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.02)}}
 @keyframes cloudtail-blink{0%,44%,46%,81%,83%,100%{transform:scaleY(1)}45%,82%{transform:scaleY(.12)}}
 @keyframes cloudtail-feature{0%,55%,100%{transform:rotate(0)}66%{transform:rotate(3deg)}74%{transform:rotate(-2deg)}84%{transform:rotate(0)}}
 @keyframes cloudtail-mold{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes cloudtail-happy{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(5px) scale(1.06,.92)}42%{transform:translateY(-27px) scale(.94,1.09)}67%{transform:translateY(1px) scale(1.09,.91)}82%{transform:translateY(-8px) scale(.98,1.03)}}
 @keyframes cloudtail-startle{0%,100%{transform:translateX(0) translateY(0) rotate(0)}18%{transform:translate(-12px,-10px) rotate(-5deg)}42%{transform:translate(9px,-2px) rotate(4deg)}68%{transform:translate(-4px,0) rotate(-2deg)}84%{transform:translate(2px,0) rotate(1deg)}}
 @keyframes cloudtail-weak{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-9px) rotate(-2deg)}46%{transform:translateY(-8px) rotate(2deg)}72%{transform:translateY(-3px) rotate(-1deg)}86%{transform:translateY(-1px)}}
 @keyframes cloudtail-mold-startle{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(11deg)}68%{transform:translateY(-4px) rotate(-3deg)}}
 @media(prefers-reduced-motion:reduce){.mo-cloudtail *{animation:none!important;transition:none!important}}
 ]]></style>
<ellipse cx="160" cy="248" rx="107" ry="7" fill="#395450" opacity=".11"/>
    <g class="tap-body"><g class="breath"><g class="feature">
    <circle cx="211" cy="223" r="29" fill="#BDD8EF"/><circle cx="251" cy="209" r="28" fill="#BDD8EF"/>
