<svg xmlns="http://www.w3.org/2000/svg" class="mo-svg mo-antenna mo-low" viewBox="0 0 320 280" width="320" height="280" role="img" aria-label="ふさアンテナ・元気">
<style><![CDATA[
 .mo-antenna{overflow:visible;user-select:none;touch-action:manipulation}
 .mo-antenna .tap-body{transform-origin:160px 235px}
 .mo-antenna .breath{transform-origin:160px 221px;animation:antenna-breath 7.6s ease-in-out infinite}
 .mo-antenna .blink{transform-box:fill-box;transform-origin:center;animation:antenna-blink 5.8s infinite}
 .mo-antenna .feature{transform-origin:167px 187px;animation:antenna-feature 4.5s ease-in-out infinite}
 .mo-antenna .mold-float{animation:antenna-mold 8.2s ease-in-out infinite}
 .mo-antenna .mold-float.late{animation-delay:-1.5s}
 .mo-antenna .mold-float.slow{animation-duration:9.4s;animation-delay:-2.1s}
 .mo-antenna.mo-medium .breath{animation-duration:8.4s}
 .mo-antenna.mo-high .breath{animation-duration:9.2s}
 .mo-antenna.mo-medium .feature{animation-duration:5.3s}
 .mo-antenna.mo-high .feature{animation-duration:6.8s}
 .mo-antenna.mo-low.is-tapped .tap-body{animation:antenna-happy .72s cubic-bezier(.22,.8,.3,1) 1 both}
 .mo-antenna.mo-medium.is-tapped .tap-body{animation:antenna-startle .69s ease-out 1 both}
 .mo-antenna.mo-high.is-tapped .tap-body{animation:antenna-weak .78s ease-out 1 both}
 .mo-antenna.is-tapped .mold-float{animation:antenna-mold-startle .78s ease-out 1 both}
 @keyframes antenna-breath{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}69%{transform:translateY(4px) rotate(0) scale(1.05,.94)}77%{transform:translateY(-16px) rotate(-3deg) scale(.97,1.06)}85%{transform:translateY(2px) rotate(2deg) scale(1.06,.94)}93%{transform:translateY(0) rotate(0) scale(1)}}
 @keyframes antenna-blink{0%,44%,46%,81%,83%,100%{transform:scaleY(1)}45%,82%{transform:scaleY(.12)}}
 @keyframes antenna-feature{0%,55%,100%{transform:rotate(0)}66%{transform:rotate(6deg)}74%{transform:rotate(-4deg)}84%{transform:rotate(0)}}
 @keyframes antenna-mold{0%,68%,100%{transform:translateY(0)}80%{transform:translateY(-11px)}90%{transform:translateY(2px)}96%{transform:translateY(0)}}
 @keyframes antenna-happy{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(6.25px) scale(1.075,0.9)}42%{transform:translateY(-33.75px) scale(0.925,1.113)}67%{transform:translateY(1.25px) scale(1.113,0.888)}82%{transform:translateY(-10px) scale(0.975,1.038)}}
 @keyframes antenna-startle{0%,100%{transform:translateX(0) translateY(0) rotate(0)}18%{transform:translate(-15px,-12.5px) rotate(-6.25deg)}42%{transform:translate(11.25px,-2.5px) rotate(5deg)}68%{transform:translate(-5px,0) rotate(-2.5deg)}84%{transform:translate(2.5px,0) rotate(1.25deg)}}
 @keyframes antenna-weak{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-11.25px) rotate(-2.5deg)}46%{transform:translateY(-10px) rotate(2.5deg)}72%{transform:translateY(-3.75px) rotate(-1.25deg)}86%{transform:translateY(-1.25px)}}
 @keyframes antenna-mold-startle{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px) rotate(13.75deg)}68%{transform:translateY(-5px) rotate(-3.75deg)}}
  @keyframes antenna-idle-stretch{0%,64%,100%{transform:translateY(0) scale(1)}71%{transform:translateY(3px) scale(1.04,0.95)}80%{transform:translateY(-9px) scale(0.9,1.15)}87%{transform:translateY(-7px) scale(0.92,1.12)}95%{transform:translateY(0) scale(1)}}
  @keyframes antenna-idle-sway{0%,64%,100%{transform:translate(0,0) rotate(0)}72%{transform:translate(-9px,-3px) rotate(-9deg)}82%{transform:translate(9px,-3px) rotate(9deg)}90%{transform:translate(-3px,0) rotate(-3deg)}97%{transform:translate(0,0) rotate(0)}}
  @keyframes antenna-idle-bow{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}74%{transform:translateY(8px) rotate(3deg) scale(1.1,0.85)}82%{transform:translateY(8px) rotate(3deg) scale(1.1,0.85)}90%{transform:translateY(-4px) rotate(-2deg) scale(0.97,1.05)}97%{transform:translateY(0) rotate(0) scale(1)}}
  @keyframes antenna-idle-double-hop{0%,64%,100%{transform:translateY(0) scale(1)}68%{transform:translateY(3px) scale(1.04,0.94)}74%{transform:translateY(-18px) scale(0.96,1.06)}80%{transform:translateY(2px) scale(1.06,0.93)}86%{transform:translateY(-11px) scale(0.97,1.04)}92%{transform:translateY(1px) scale(1.03,0.97)}98%{transform:translateY(0) scale(1)}}
  @media(prefers-reduced-motion:reduce){.mo-antenna *{animation:none!important;transition:none!important}}
 ]]></style>
<ellipse cx="160" cy="247" rx="71" ry="7" fill="#395450" opacity=".09"/>
        <g class="tap-body"><g class="breath">
        <g class="feature"><path d="M133 154 Q111 111 104 94 Q101 84 91 83" fill="none" stroke="#F7D994" stroke-width="9" stroke-linecap="round"/>
        <path d="M185 154 Q180 120 191 94 Q195 81 194 75" fill="none" stroke="#F7D994" stroke-width="9" stroke-linecap="round"/>
        <circle cx="89" cy="80" r="16" fill="#F7D994"/><circle cx="194" cy="72" r="16" fill="#F7D994"/></g>
        <path d="M222 187 Q249 182 241 199 Q237 210 218 211" fill="#F7D994"/>
        <ellipse cx="160" cy="191" rx="64" ry="51" fill="#FFF9F1"/>
        <ellipse cx="124" cy="230" rx="11" ry="8" fill="#F7D994"/><ellipse cx="197" cy="230" rx="11" ry="8" fill="#F7D994"/>
        <g class="blink"><ellipse cx="140" cy="189" rx="3.5" ry="4.2" fill="#395450"/><ellipse cx="181" cy="189" rx="3.5" ry="4.2" fill="#395450"/></g><path d="M153 205 Q160 212 167 205" fill="none" stroke="#395450" stroke-width="2.8" stroke-linecap="round"/>
        </g></g>
</svg>