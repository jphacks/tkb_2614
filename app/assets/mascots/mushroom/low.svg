<svg xmlns="http://www.w3.org/2000/svg" class="mo-svg mo-mushroom mo-low" viewBox="0 0 320 280" width="320" height="280" role="img" aria-label="きのこまもり・元気">
<style><![CDATA[
 .mo-mushroom{overflow:visible;user-select:none;touch-action:manipulation}
 .mo-mushroom .tap-body{transform-origin:160px 235px}
 .mo-mushroom .breath{transform-origin:160px 221px;animation:mushroom-breath 7.6s ease-in-out infinite}
 .mo-mushroom .blink{transform-box:fill-box;transform-origin:center;animation:mushroom-blink 5.8s infinite}
 .mo-mushroom .feature{transform-origin:167px 187px;animation:mushroom-feature 4.5s ease-in-out infinite}
 .mo-mushroom .mold-float{animation:mushroom-mold 8.2s ease-in-out infinite}
 .mo-mushroom .mold-float.late{animation-delay:-1.5s}
 .mo-mushroom .mold-float.slow{animation-duration:9.4s;animation-delay:-2.1s}
 .mo-mushroom.mo-medium .breath{animation-duration:8.4s}
 .mo-mushroom.mo-high .breath{animation-duration:9.2s}
 .mo-mushroom.mo-medium .feature{animation-duration:5.3s}
 .mo-mushroom.mo-high .feature{animation-duration:6.8s}
 .mo-mushroom.mo-low.is-tapped .tap-body{animation:mushroom-happy .72s cubic-bezier(.22,.8,.3,1) 1 both}
 .mo-mushroom.mo-medium.is-tapped .tap-body{animation:mushroom-startle .69s ease-out 1 both}
 .mo-mushroom.mo-high.is-tapped .tap-body{animation:mushroom-weak .78s ease-out 1 both}
 .mo-mushroom.is-tapped .mold-float{animation:mushroom-mold-startle .78s ease-out 1 both}
 @keyframes mushroom-breath{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}69%{transform:translateY(4px) rotate(0) scale(1.05,.94)}77%{transform:translateY(-16px) rotate(-3deg) scale(.97,1.06)}85%{transform:translateY(2px) rotate(2deg) scale(1.06,.94)}93%{transform:translateY(0) rotate(0) scale(1)}}
 @keyframes mushroom-blink{0%,44%,46%,81%,83%,100%{transform:scaleY(1)}45%,82%{transform:scaleY(.12)}}
 @keyframes mushroom-feature{0%,55%,100%{transform:rotate(0)}66%{transform:rotate(6deg)}74%{transform:rotate(-4deg)}84%{transform:rotate(0)}}
 @keyframes mushroom-mold{0%,68%,100%{transform:translateY(0)}80%{transform:translateY(-11px)}90%{transform:translateY(2px)}96%{transform:translateY(0)}}
 @keyframes mushroom-happy{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(6.25px) scale(1.075,0.9)}42%{transform:translateY(-33.75px) scale(0.925,1.113)}67%{transform:translateY(1.25px) scale(1.113,0.888)}82%{transform:translateY(-10px) scale(0.975,1.038)}}
 @keyframes mushroom-startle{0%,100%{transform:translateX(0) translateY(0) rotate(0)}18%{transform:translate(-15px,-12.5px) rotate(-6.25deg)}42%{transform:translate(11.25px,-2.5px) rotate(5deg)}68%{transform:translate(-5px,0) rotate(-2.5deg)}84%{transform:translate(2.5px,0) rotate(1.25deg)}}
 @keyframes mushroom-weak{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-11.25px) rotate(-2.5deg)}46%{transform:translateY(-10px) rotate(2.5deg)}72%{transform:translateY(-3.75px) rotate(-1.25deg)}86%{transform:translateY(-1.25px)}}
 @keyframes mushroom-mold-startle{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px) rotate(13.75deg)}68%{transform:translateY(-5px) rotate(-3.75deg)}}
  @keyframes mushroom-idle-stretch{0%,64%,100%{transform:translateY(0) scale(1)}71%{transform:translateY(3px) scale(1.04,0.95)}80%{transform:translateY(-9px) scale(0.9,1.15)}87%{transform:translateY(-7px) scale(0.92,1.12)}95%{transform:translateY(0) scale(1)}}
  @keyframes mushroom-idle-sway{0%,64%,100%{transform:translate(0,0) rotate(0)}72%{transform:translate(-9px,-3px) rotate(-9deg)}82%{transform:translate(9px,-3px) rotate(9deg)}90%{transform:translate(-3px,0) rotate(-3deg)}97%{transform:translate(0,0) rotate(0)}}
  @keyframes mushroom-idle-bow{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}74%{transform:translateY(8px) rotate(3deg) scale(1.1,0.85)}82%{transform:translateY(8px) rotate(3deg) scale(1.1,0.85)}90%{transform:translateY(-4px) rotate(-2deg) scale(0.97,1.05)}97%{transform:translateY(0) rotate(0) scale(1)}}
  @keyframes mushroom-idle-double-hop{0%,64%,100%{transform:translateY(0) scale(1)}68%{transform:translateY(3px) scale(1.04,0.94)}74%{transform:translateY(-18px) scale(0.96,1.06)}80%{transform:translateY(2px) scale(1.06,0.93)}86%{transform:translateY(-11px) scale(0.97,1.04)}92%{transform:translateY(1px) scale(1.03,0.97)}98%{transform:translateY(0) scale(1)}}
  @media(prefers-reduced-motion:reduce){.mo-mushroom *{animation:none!important;transition:none!important}}
 ]]></style>
<ellipse cx="164" cy="248" rx="79" ry="7" fill="#395450" opacity=".09"/>
        <g class="tap-body"><g class="breath">
        <path d="M111 182 Q107 214 121 234 Q148 249 193 241 Q220 229 215 187 Q206 152 163 150 Q120 151 111 182 Z" fill="#FFF9F1"/>
        <ellipse cx="127" cy="236" rx="9" ry="7" fill="#F4BCC3"/><ellipse cx="197" cy="236" rx="9" ry="7" fill="#F4BCC3"/>
        <g class="feature"><path d="M82 156 C73 132 92 88 131 75 C167 59 201 64 225 91 Q255 119 257 148 Q260 164 232 171 Q190 145 160 153 Q126 151 108 173 Q90 170 82 156 Z" fill="#F4BCC3"/>
        <path d="M105 170 Q150 133 202 158 Q229 167 239 168 Q215 190 167 171 Q127 160 111 179 Z" fill="#FAE0DC"/></g>
        <g class="blink"><ellipse cx="145" cy="198" rx="3.5" ry="4.2" fill="#395450"/><ellipse cx="181" cy="198" rx="3.5" ry="4.2" fill="#395450"/></g><path d="M156 212 Q163 219 170 212" fill="none" stroke="#395450" stroke-width="2.8" stroke-linecap="round"/>
        </g></g>
</svg>