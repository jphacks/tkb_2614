      <path d="M-18 1 C-25 -7 -19 -17 -9 -17 C-6 -27 7 -25 12 -17 C25 -18 28 -4 20 4 C25 15 11 22 2 16 C-7 22 -19 15 -18 1 Z" fill="#8FA79C"/>
      <circle cx="-5.5" cy="0" r="2.25" fill="#35544F"/>
