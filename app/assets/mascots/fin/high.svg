<svg xmlns="http://www.w3.org/2000/svg" class="mo-svg mo-fin mo-high" viewBox="0 0 320 280" width="320" height="280" role="img" aria-label="しめり背びれ・ぐったり">
<style><![CDATA[
 .mo-fin{overflow:visible;user-select:none;touch-action:manipulation}
 .mo-fin .tap-body{transform-origin:160px 235px}
 .mo-fin .breath{transform-origin:160px 221px;animation:fin-breath 7.6s ease-in-out infinite}
 .mo-fin .blink{transform-box:fill-box;transform-origin:center;animation:fin-blink 5.8s infinite}
 .mo-fin .feature{transform-origin:167px 187px;animation:fin-feature 4.5s ease-in-out infinite}
 .mo-fin .mold-float{animation:fin-mold 8.2s ease-in-out infinite}
 .mo-fin .mold-float.late{animation-delay:-1.5s}
 .mo-fin .mold-float.slow{animation-duration:9.4s;animation-delay:-2.1s}
 .mo-fin.mo-medium .breath{animation-duration:8.4s}
 .mo-fin.mo-high .breath{animation-duration:9.2s}
 .mo-fin.mo-medium .feature{animation-duration:5.3s}
 .mo-fin.mo-high .feature{animation-duration:6.8s}
 .mo-fin.mo-low.is-tapped .tap-body{animation:fin-happy .72s cubic-bezier(.22,.8,.3,1) 1 both}
 .mo-fin.mo-medium.is-tapped .tap-body{animation:fin-startle .69s ease-out 1 both}
 .mo-fin.mo-high.is-tapped .tap-body{animation:fin-weak .78s ease-out 1 both}
 .mo-fin.is-tapped .mold-float{animation:fin-mold-startle .78s ease-out 1 both}
 @keyframes fin-breath{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}75%{transform:translateY(6px) rotate(0) scale(1.05,.92)}86%{transform:translateY(7px) rotate(1deg) scale(1.06,.9)}97%{transform:translateY(0) rotate(0) scale(1)}}
 @keyframes fin-blink{0%,44%,46%,81%,83%,100%{transform:scaleY(1)}45%,82%{transform:scaleY(.12)}}
 @keyframes fin-feature{0%,55%,100%{transform:rotate(0)}66%{transform:rotate(6deg)}74%{transform:rotate(-4deg)}84%{transform:rotate(0)}}
 @keyframes fin-mold{0%,68%,100%{transform:translateY(0)}80%{transform:translateY(-11px)}90%{transform:translateY(2px)}96%{transform:translateY(0)}}
 @keyframes fin-happy{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(6.25px) scale(1.075,0.9)}42%{transform:translateY(-33.75px) scale(0.925,1.113)}67%{transform:translateY(1.25px) scale(1.113,0.888)}82%{transform:translateY(-10px) scale(0.975,1.038)}}
 @keyframes fin-startle{0%,100%{transform:translateX(0) translateY(0) rotate(0)}18%{transform:translate(-15px,-12.5px) rotate(-6.25deg)}42%{transform:translate(11.25px,-2.5px) rotate(5deg)}68%{transform:translate(-5px,0) rotate(-2.5deg)}84%{transform:translate(2.5px,0) rotate(1.25deg)}}
 @keyframes fin-weak{0%,100%{transform:translateY(0) rotate(0) scale(1)}22%{transform:translateY(4px) rotate(-1.5deg) scale(1.03,.96)}50%{transform:translateY(7px) rotate(1deg) scale(1.05,.93)}78%{transform:translateY(3px) rotate(-.5deg) scale(1.02,.97)}}
 @keyframes fin-mold-startle{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px) rotate(13.75deg)}68%{transform:translateY(-5px) rotate(-3.75deg)}}
  @keyframes fin-idle-droop-left{0%,64%,100%{transform:translate(0,0) rotate(0) scale(1)}76%{transform:translate(-3px,4px) rotate(-5deg) scale(1.02,.96)}87%{transform:translate(-4px,5px) rotate(-6deg) scale(1.03,.94)}98%{transform:translate(0,0) rotate(0) scale(1)}}
  @keyframes fin-idle-droop-right{0%,64%,100%{transform:translate(0,0) rotate(0) scale(1)}77%{transform:translate(3px,5px) rotate(5deg) scale(1.03,.94)}89%{transform:translate(4px,6px) rotate(6deg) scale(1.04,.92)}98%{transform:translate(0,0) rotate(0) scale(1)}}
  @keyframes fin-idle-settle{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}73%{transform:translateY(2px) rotate(-2deg) scale(1.02,.97)}81%{transform:translateY(4px) rotate(2deg) scale(1.03,.95)}89%{transform:translateY(3px) rotate(-1deg) scale(1.02,.96)}98%{transform:translateY(0) rotate(0) scale(1)}}
  @keyframes fin-idle-slump{0%,64%,100%{transform:translateY(0) rotate(0) scale(1)}73%{transform:translateY(4px) rotate(2deg) scale(1.04,.94)}83%{transform:translateY(8px) rotate(3deg) scale(1.07,.88)}91%{transform:translateY(8px) rotate(3deg) scale(1.07,.88)}99%{transform:translateY(0) rotate(0) scale(1)}}
  @media(prefers-reduced-motion:reduce){.mo-fin *{animation:none!important;transition:none!important}}
 ]]></style>
